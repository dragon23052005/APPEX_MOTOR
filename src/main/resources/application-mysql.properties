# Compose reads .env automatically; Spring imports the same file as properties.
# Use simple unquoted values (generated hexadecimal passwords work in both).
spring.config.import=optional:file:./.env[.properties]
spring.datasource.url=jdbc:mysql://${DB_HOST:127.0.0.1}:${MYSQL_PORT:3306}/demotesting?connectionTimeZone=UTC&forceConnectionTimeZoneToSession=true&characterEncoding=UTF-8&sslMode=${MYSQL_SSL_MODE:PREFERRED}
spring.datasource.username= root
spring.datasource.password=123456
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver
spring.datasource.hikari.maximum-pool-size=5
spring.datasource.hikari.connection-timeout=10000
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.jdbc.time_zone=UTC
spring.jpa.show-sql=false
spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration
spring.flyway.baseline-on-migrate=false
spring.flyway.clean-disabled=true
spring.flyway.validate-on-migrate=true
spring.sql.init.mode=never
