<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/site :: head('Access restricted — APEX MOTORS', 'Your personal APEX MOTORS account.')}"></head>
<body class="account-page">
<a class="account-skip" href="#account-main">Skip to account content</a>
<nav th:replace="~{fragments/site :: nav(${activePage})}"></nav>
<main id="account-main" class="account-message">
<p class="eyebrow">APEX / Account access</p>
<h1 th:text="${accountErrorTitle}">This area is restricted.</h1>
<p th:text="${accountErrorMessage}">Your account does not have permission to access this page.</p>
<div class="account-message__actions"><a class="account-submit" th:href="${accountSignedIn} ? @{/profile} : @{/login}" th:text="${accountSignedIn} ? 'Return to my profile' : 'Go to sign in'">Return to my profile</a><a class="account-back" th:href="@{/collection}">Explore the collection ↗</a></div>
</main>
<th:block th:replace="~{fragments/site :: scripts}"></th:block>
</body>
</html>
